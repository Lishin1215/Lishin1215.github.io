{{ define "main" }}
  <article class="page report-landing">
    <p class="eyebrow">Google Summer of Code</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
      <p class="hero-copy">{{ . }}</p>
    {{ end }}

    <div class="report-grid">
      {{ range .Pages.ByWeight }}
        <a class="report-card" href="{{ .RelPermalink }}">
          <span class="report-card-label">Final Report</span>
          <h2>{{ .Title }}</h2>
          <p>{{ .Description }}</p>
          <span class="report-card-link">Open section <span aria-hidden="true">&rarr;</span></span>
        </a>
      {{ end }}
    </div>

    <a class="report-back-link" href="/#work">&larr; Back to projects</a>
  </article>
{{ end }}
