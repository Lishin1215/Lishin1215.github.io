<!doctype html>
<html lang="{{ if eq .Section "gccrs-final-report" }}en{{ else }}{{ site.Language.LanguageCode }}{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #6a6f77;
      --line: #ded7cc;
      --paper: #fbfaf7;
      --panel: #ffffff;
      --accent: #2f6f73;
      --accent-soft: #e2f0ef;
      --shadow: 0 18px 55px rgba(32, 33, 36, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(222, 215, 204, 0.86);
      background: rgba(251, 250, 247, 0.88);
      backdrop-filter: blur(18px);
    }

    .nav {
      width: min(1120px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 750;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 10px 12px;
      border-radius: 6px;
    }

    .nav-links a:hover,
    .text-link:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    main,
    .site-footer {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      min-height: calc(100vh - 68px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: center;
      gap: 56px;
      padding: 72px 0 64px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 760px; margin-bottom: 22px; font-size: clamp(3.2rem, 7vw, 6.8rem); line-height: 0.94; }
    h2 { font-size: clamp(1.9rem, 4vw, 3.2rem); line-height: 1.02; }
    h3 { font-size: 1.22rem; line-height: 1.2; }
    .hero-copy, .section-heading p, .card p, .muted { color: var(--muted); }
    .hero-copy { max-width: 650px; font-size: 1.12rem; }

    .hero-actions,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      font-weight: 720;
    }

    .button.primary { background: var(--ink); color: #fff; }
    .button.secondary { background: var(--panel); color: var(--ink); }
    .portrait-shell { display: grid; place-items: center; }
    .portrait { width: min(100%, 340px); aspect-ratio: 1; object-fit: cover; border: 1px solid var(--line); box-shadow: var(--shadow); }

    .work-landing {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 0;
    }

    section,
    .page {
      padding: 84px 0;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
      margin-bottom: 34px;
    }

    .work-heading {
      display: block;
      max-width: 760px;
      margin-bottom: 42px;
    }

    .work-heading h2 {
      margin-bottom: 16px;
    }

    .work-heading p {
      max-width: 680px;
      font-size: 1.06rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(32, 33, 36, 0.04);
    }

    .project-card {
      min-height: 260px;
      display: grid;
      align-content: start;
      gap: 14px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(32, 33, 36, 0.04);
    }

    .project-card.featured {
      grid-column: 1 / -1;
      border-color: rgba(47, 111, 115, 0.42);
      box-shadow: inset 4px 0 0 var(--accent), 0 14px 34px rgba(32, 33, 36, 0.06);
    }

    .project-card.featured .card-label {
      border-color: transparent;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .project-card h3 {
      margin-bottom: 0;
      font-size: 1.32rem;
    }

    .project-title-link {
      color: inherit;
    }

    .project-title-link:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .project-meta {
      margin-bottom: 0;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .project-summary {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.72;
    }

    .project-summary-list {
      display: grid;
      gap: 10px;
      padding-left: 1.15rem;
      margin: 0;
      color: var(--muted);
      line-height: 1.58;
    }

    .project-summary-list li::marker {
      color: var(--accent);
    }

    .project-links {
      display: grid;
      margin-top: 4px;
      border-top: 1px solid var(--line);
    }

    .project-links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      padding: 9px 2px;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 720;
    }

    .project-links a::after {
      content: "\2192";
      margin-left: 12px;
      font-size: 1.05rem;
    }

    .project-links a:hover {
      padding-left: 6px;
      padding-right: 6px;
      background: linear-gradient(90deg, var(--accent-soft), transparent);
    }

    .card-label {
      width: fit-content;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 760;
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .contact-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 28px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .about-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
      gap: 36px;
      align-items: center;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .contact-list { display: grid; gap: 12px; }

    .contact-list a,
    .post-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
    }

    .content {
      max-width: 760px;
      color: var(--ink);
    }

    .page h1 {
      max-width: 900px;
      font-size: clamp(2.25rem, 5vw, 4.25rem);
      line-height: 1.05;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 48px;
    }

    .report-card {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(32, 33, 36, 0.04);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .report-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }

    .report-card-label {
      margin-bottom: 36px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .report-card h2 {
      margin-bottom: 12px;
      font-size: clamp(1.55rem, 3vw, 2.15rem);
    }

    .report-card p {
      margin-bottom: 28px;
      color: var(--muted);
    }

    .report-card-link {
      margin-top: auto;
      color: var(--accent);
      font-weight: 720;
    }

    .report-back-link {
      display: inline-block;
      margin-top: 36px;
      color: var(--muted);
      font-weight: 650;
    }

    .report-top-link {
      margin-top: 22px;
    }

    .content p,
    .content li {
      color: var(--muted);
    }

    .content a,
    .text-link {
      color: var(--accent);
      font-weight: 700;
    }

    .rustc-reference {
      margin: 28px 0 32px;
      padding: 16px 18px;
      border: 1px solid rgba(47, 111, 115, 0.28);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      background: var(--accent-soft);
    }

    .rustc-reference p {
      margin: 0;
      color: var(--ink);
    }

    .rustc-reference strong {
      color: var(--accent);
    }

    .content h2 {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    .content h3 {
      margin-top: 28px;
      margin-bottom: 10px;
    }

    .content pre {
      overflow-x: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f3f1eb;
    }

    .content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .content table {
      width: 100%;
      margin: 24px 0 32px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-spacing: 0;
      border-radius: 8px;
      table-layout: fixed;
      background: var(--panel);
      font-size: 0.9rem;
    }

    .content th,
    .content td {
      padding: 12px 14px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .content th {
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .content th:first-child,
    .content td:first-child {
      width: 20%;
      color: var(--ink);
      font-weight: 700;
    }

    .content th:last-child,
    .content td:last-child {
      border-right: 0;
    }

    .content tbody tr:last-child td {
      border-bottom: 0;
    }

    .project-overview-page .content table {
      display: block;
      margin-top: 28px;
      overflow-x: auto;
      table-layout: auto;
      font-size: 0.88rem;
    }

    .project-overview-page .content thead,
    .project-overview-page .content tbody {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .project-overview-page .content tbody tr:nth-child(even) {
      background: #faf9f5;
    }

    .project-overview-page .content tbody tr:hover {
      background: var(--accent-soft);
    }

    .project-overview-page .content th:first-child,
    .project-overview-page .content td:first-child {
      width: 18%;
    }

    .project-overview-page .content th:nth-child(2),
    .project-overview-page .content td:nth-child(2) {
      width: 23%;
    }

    .project-overview-page .content th:nth-child(3),
    .project-overview-page .content td:nth-child(3) {
      width: 41%;
    }

    .project-overview-page .content th:nth-child(4),
    .project-overview-page .content td:nth-child(4) {
      width: 18%;
    }

    .project-overview-page .content td:nth-child(4) a {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      font-size: 0.82rem;
      font-weight: 720;
      text-decoration: none;
    }

    .pr-notes-page > h1 {
      margin-bottom: 18px;
    }

    .pr-notes-intro {
      margin-top: 30px;
    }

    .pr-stage-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
    }

    .pr-stage-nav a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 720;
    }

    .pr-stage-nav a span {
      min-width: 1.45rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
    }

    .pr-stage-nav a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pr-overview {
      margin-top: 54px;
    }

    .pr-overview-group {
      padding: 54px 0 0;
      border-top: 0;
      scroll-margin-top: 90px;
    }

    .pr-stage-heading {
      max-width: 760px;
      margin-bottom: 26px;
    }

    .pr-stage-number,
    .pr-overview-number {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 780;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pr-stage-heading h2 {
      margin-bottom: 12px;
      font-size: clamp(1.75rem, 3.5vw, 2.7rem);
    }

    .pr-stage-heading > p:last-child {
      margin-bottom: 0;
      color: var(--muted);
    }

    .pr-overview-list {
      border-top: 1px solid var(--line);
    }

    .pr-overview-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 22px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      transition: padding 160ms ease, background 160ms ease;
    }

    .pr-overview-item:hover {
      padding-right: 14px;
      padding-left: 14px;
      background: linear-gradient(90deg, var(--accent-soft), transparent 80%);
    }

    .pr-overview-item-review {
      box-shadow: inset 3px 0 0 #b8872e;
    }

    .pr-overview-item-superseded {
      background: #fbfafa;
    }

    .pr-overview-meta,
    .pr-detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pr-overview-number {
      margin: 0;
    }

    .pr-overview-item h3 {
      margin: 8px 0 12px;
      font-size: clamp(1.12rem, 2.2vw, 1.42rem);
    }

    .pr-overview-arrow {
      color: var(--accent);
      font-size: 1.2rem;
      transition: transform 160ms ease;
    }

    .pr-overview-item:hover .pr-overview-arrow {
      transform: translateX(4px);
    }

    .pr-status {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 780;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pr-status-merged {
      border-color: rgba(47, 111, 115, 0.34);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pr-status-review,
    .pr-status-draft,
    .pr-status-experimental {
      background: #f5ecd8;
      color: #815f20;
    }

    .pr-status-superseded {
      background: #f0eded;
      color: #736767;
    }

    .pr-detail-page .report-top-link + .eyebrow {
      margin-top: 48px;
    }

    .pr-detail-page > h1 {
      max-width: 920px;
      margin-bottom: 24px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.08;
    }

    .pr-detail-meta {
      margin-bottom: 48px;
    }

    .pr-detail-content {
      max-width: 900px;
      border-top: 1px solid var(--line);
    }

    .pr-detail-content > h2 {
      margin: 0 0 14px;
      padding-top: 30px;
      border-top: 0;
      font-size: clamp(1.3rem, 2.4vw, 1.65rem);
    }

    .pr-detail-content > h2:not(:first-child) {
      margin-top: 30px;
      border-top: 1px solid var(--line);
    }

    .pr-detail-content > p {
      margin-bottom: 14px;
    }

    .pr-detail-content > ul {
      margin-bottom: 0;
    }

    .pr-detail-content > ul {
      display: grid;
      gap: 9px;
      padding-left: 1.2rem;
    }

    .pr-detail-content li::marker {
      color: var(--accent);
    }

    .pr-detail-content blockquote {
      max-width: 900px;
      margin-top: 30px;
      margin-right: 0;
      margin-left: 0;
      padding: 22px 24px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
    }

    .pr-detail-content blockquote p {
      margin-bottom: 10px;
      color: var(--ink);
    }

    .pr-detail-content blockquote p:last-child {
      margin-bottom: 0;
    }

    .pr-primary-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      padding: 11px 15px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-weight: 740;
    }

    .pr-primary-link:hover {
      background: var(--accent-soft);
    }

    .pr-detail-pagination {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 54px;
    }

    .pr-detail-pagination a {
      display: grid;
      gap: 6px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
    }

    .pr-detail-pagination .pr-page-next {
      grid-column: 2;
      text-align: right;
    }

    .pr-detail-pagination a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .pr-detail-pagination span {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 760;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pr-detail-pagination strong {
      color: var(--ink);
      font-size: 0.9rem;
    }

    .site-footer {
      padding: 36px 0 46px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 860px) {
      .nav { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      .nav-links { width: 100%; overflow-x: auto; padding-bottom: 2px; }
      .hero, .section-heading, .contact-panel, .about-panel { grid-template-columns: 1fr; }
      .hero { gap: 32px; min-height: auto; padding-top: 56px; }
      .work-landing { min-height: auto; padding-top: 56px; }
      .portrait-shell { order: -1; justify-content: start; }
      .portrait { width: min(100%, 280px); }
      .grid, .project-grid { grid-template-columns: 1fr; }
      .report-grid { grid-template-columns: 1fr; }
      .project-overview-page .content thead,
      .project-overview-page .content tbody { width: 820px; }
      .pr-overview-item { gap: 12px; }
      .pr-overview-item:hover { padding-right: 8px; padding-left: 8px; }
      .pr-detail-pagination { grid-template-columns: 1fr; }
      .pr-detail-pagination .pr-page-next { grid-column: auto; text-align: left; }
      .content table { font-size: 0.8rem; }
      .content th, .content td { padding: 9px 8px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="/" aria-label="Home">
        <span class="brand-mark">L</span>
        <span>{{ site.Title }}</span>
      </a>
      <div class="nav-links">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </div>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ now.Year }} {{ site.Title }}</span>
  </footer>
</body>
</html>
